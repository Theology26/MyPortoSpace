# ==============================================================
# Nginx Configuration for theoverse.my.id
# Lokasi file di Kubuntu: /etc/nginx/sites-available/theoverse.my.id
# Simlink: sudo ln -s /etc/nginx/sites-available/theoverse.my.id /etc/nginx/sites-enabled/
# ==============================================================

server {
    listen 80;
    listen [::]:80;
    server_name theoverse.my.id www.theoverse.my.id;

    # Redirect all HTTP requests to HTTPS
    # (Aktifkan setelah pasang sertifikat SSL dengan certbot)
    # return 301 https://$host$request_uri;

    # --- SEMENTARA (Sebelum SSL aktif, arahkan langsung ke Node.js) ---
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Real Client IP forwarding (sangat penting untuk Rate Limiter aplikasi)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Static assets caching optimization
    location /Assets/ {
        proxy_pass http://127.0.0.1:3000/Assets/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }
}

