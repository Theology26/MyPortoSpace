  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      font-family: 'Geist', system-ui, sans-serif;
      background: #08080a;
      color: #e5e1e4;
      overflow-x: hidden;
      width: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #08080a; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Hide scrollbar utility */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Glassmorphism Utility */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 1px 1px rgba(255,255,255,0.3);
    }
    .glass-card-strong {
      background: rgba(16, 20, 30, 0.50);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 2px 1px rgba(255,255,255,0.15);
    }
    .glass-pill {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 1px 1px rgba(255,255,255,0.3);
    }

    /* Eco / Kentang Mode Styling (Ultra-Lightweight for Budget Devices) */
    body.eco-mode .glass-card,
    body.eco-mode .glass-card-strong,
    body.eco-mode .glass-pill {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: rgba(14, 18, 26, 0.94) !important;
      box-shadow: none !important;
    }
    body.eco-mode .ambient-glow {
      display: none !important;
    }
    .eco-starfield {
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 120px 80px, #38bdf8, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 240px 190px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 320px 140px, #fde047, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 450px 220px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 500px 350px;
      opacity: 0.45;
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Ambient glow */
    .ambient-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
    }

    /* Barcode lines */
    .barcode-line {
      display: inline-block;
      height: 24px;
      background: white;
    }

    /* Watermark background icon */
    .watermark-icon {
      position: absolute;
      right: -8px;
      bottom: -8px;
      opacity: 0.08;
      pointer-events: none;
      z-index: 1;
    }

    /* Lanyard spring animation */
    @keyframes springBounce {
      0% { transform: translateY(0); }
      30% { transform: translateY(12px); }
      50% { transform: translateY(-4px); }
      70% { transform: translateY(3px); }
      85% { transform: translateY(-1px); }
      100% { transform: translateY(0); }
    }
    .spring-bounce { animation: springBounce 0.8s ease-out; }

    /* Fade-in animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in-up {
      opacity: 0;
      animation: fadeInUp 0.7s ease-out forwards;
    }
    .delay-100 { animation-delay: 0.1s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    .delay-500 { animation-delay: 0.5s; }
    .delay-600 { animation-delay: 0.6s; }

    /* Content visibility for performance on long pages */
    .cv-auto {
      content-visibility: auto;
      contain-intrinsic-size: 1px 700px;
    }

    /* Navbar blur on scroll */
    .nav-scrolled {
      background: rgba(8, 8, 10, 0.88) !important;
      backdrop-filter: blur(24px) !important;
      border-color: rgba(255,255,255,0.08) !important;
    }
